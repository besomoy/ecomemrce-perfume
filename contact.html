<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Scent & Aura</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Bootstrap CSS -->
    <link href="./assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="./assets/css/style.css" rel="stylesheet">
    <script src="./assets/vendor/lucide/lucide.js"></script>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar-custom" id="navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="logo">
                <img src="./assets/images/logo.svg" alt="Scent & Aura" height="28">
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="shop-right-sidebar.html">Shop</a>
                <a href="contact.html">Contact</a>
            </div>
            <div class="nav-icons">
                <a href="cart.html"><i data-lucide="shopping-bag" width="20"></i></a>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <div class="container">
            <h1 class="display-3 mb-3">Contact Us</h1>
        </div>
    </div>

    <!-- Contact Content -->
    <section class="py-section bg-white">
        <div class="container">
            <div class="row g-5">
                <div class="col-lg-4">
                    <div class="contact-info-box text-center p-5 bg-surface rounded-4">
                        <div class="icon-box mx-auto mb-4 bg-white rounded-circle d-flex align-items-center justify-content-center shadow-sm"
                            style="width: 60px; height: 60px;">
                            <i data-lucide="map-pin" class="text-primary"></i>
                        </div>
                        <h4 class="font-serif mb-3">Visit Us</h4>
                        <p class="text-gray-500 mb-0">1234 Fashion Street,<br>Suite 567, New York</p>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="contact-info-box text-center p-5 bg-surface rounded-4">
                        <div class="icon-box mx-auto mb-4 bg-white rounded-circle d-flex align-items-center justify-content-center shadow-sm"
                            style="width: 60px; height: 60px;">
                            <i data-lucide="phone" class="text-primary"></i>
                        </div>
                        <h4 class="font-serif mb-3">Call Us</h4>
                        <p class="text-gray-500 mb-0">(212) 555-1234<br>Mon-Fri, 9am-6pm</p>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="contact-info-box text-center p-5 bg-surface rounded-4">
                        <div class="icon-box mx-auto mb-4 bg-white rounded-circle d-flex align-items-center justify-content-center shadow-sm"
                            style="width: 60px; height: 60px;">
                            <i data-lucide="mail" class="text-primary"></i>
                        </div>
                        <h4 class="font-serif mb-3">Email Us</h4>
                        <p class="text-gray-500 mb-0">info@scentaura.com<br>support@scentaura.com</p>
                    </div>
                </div>
            </div>

            <div class="row mt-5 pt-5 justify-content-center">
                <div class="col-lg-8">
                    <div class="text-center mb-5">
                        <h2 class="display-5 font-serif text-secondary-dark">Get in Touch</h2>
                        <p class="text-gray-400">We'd love to hear from you. Send us a message below.</p>
                    </div>
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <input type="text" class="form-control rounded-0 p-3" placeholder="Your Name">
                            </div>
                            <div class="col-md-6">
                                <input type="email" class="form-control rounded-0 p-3" placeholder="Your Email">
                            </div>
                            <div class="col-12">
                                <textarea class="form-control rounded-0 p-3" rows="5"
                                    placeholder="Your Message"></textarea>
                            </div>
                            <div class="col-12 text-center">
                                <button class="btn btn--primary px-5 py-3 mt-3">Send Message</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Map -->
            <div class="mt-5 pt-5">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3022.1422937950147!2d-73.98731968459391!3d40.74844097932847!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c259a9b3117469%3A0xd134e199a405a163!2sEmpire%20State%20Building!5e0!3m2!1sen!2sus!4v1629783512345!5m2!1sen!2sus"
                    width="100%" height="450" style="border:0; filter: grayscale(1);" allowfullscreen=""
                    loading="lazy"></iframe>
            </div>
        </div>
    </section>

    <footer class="bg-footer text-white border-secondary" style="padding-top: 80px;">
        <div class="container text-center pb-4">
            <p class="mb-2 mb-md-0">&copy; 2026 Scent & Aura. All Rights Reserved</p>
        </div>
    </footer>
    <script src="./assets/js/main.js"></script>
</body>

</html>
