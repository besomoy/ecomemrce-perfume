<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Scent & Aura</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="./assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="./assets/css/style.css" rel="stylesheet">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="./assets/vendor/swiper/swiper-bundle.min.css" />
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar-custom" id="navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="logo">
                <img src="./assets/images/logo.svg" alt="Scent & Aura" height="28">
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="shop-right-sidebar.html">Shop</a>
                <a href="about-us.html">About Us</a>
            </div>
            <div class="nav-icons">
                <a href="cart.html" class="position-relative" title="Cart">
                    <i data-lucide="shopping-bag" width="20"></i>
                    <span class="cart-badge">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Sign In Content -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="logo-area">
                <img src="./assets/images/logo.svg" alt="Scent & Aura">
            </div>
            <h1>Welcome Back</h1>
            <p class="auth-subtitle">Sign in to your account to continue</p>

            <form>
                <div class="text-start">
                    <label class="form-label small text-uppercase fw-bold text-gray-400">Email Address</label>
                    <input type="email" class="form-control" placeholder="name@example.com">
                </div>
                <div class="text-start mt-3">
                    <div class="d-flex justify-content-between">
                        <label class="form-label small text-uppercase fw-bold text-gray-400">Password</label>
                        <a href="#" class="small text-muted text-decoration-none">Forgot Password?</a>
                    </div>
                    <input type="password" class="form-control" placeholder="********">
                </div>

                <div class="form-check text-start mt-3 mb-4">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-muted small" for="rememberMe">Remember Me</label>
                </div>

                <button type="submit" class="btn btn--primary w-100 py-2">Sign In</button>
            </form>

            <p class="mt-4 text-muted small">
                Don't have an account? <a href="sign-up.html" class="text-primary fw-bold text-decoration-none">Sign
                    Up</a>
            </p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-footer text-white border-secondary" style="padding-top: 80px;">
        <div class="container text-center pb-4">
            <p class="mb-2 mb-md-0">&copy; 2026 Scent & Aura. All Rights Reserved</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="./assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/vendor/lucide/lucide.js"></script>
    <script src="./assets/js/main.js"></script>
</body>

</html>
